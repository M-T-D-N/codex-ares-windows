    <path d="M967 117V165M961 157L967 165L973 157" fill="none" stroke="#80d4bc" stroke-width="2"/>
    <rect x="794" y="181" width="272" height="48" rx="6" fill="#132d35" stroke="#80d4bc" stroke-width="1.5"/>
